[package]
name = "wazzup"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland"] }
tokio = { version = "1.43", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.17"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
xattr = { path = "patches/xattr" }
