[package]
name = "wazzup"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.17"

[profile.dev]
debug = 0

[profile.test]
debug = 0
